spring.application.name=Finance Backend
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/financedb
spring.datasource.username=finance
spring.datasource.password=finance123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# JPA / Hibernate ORM settings
# 'update' allows Envers to auto-create revinfo + financial_records_aud tables.
# Switch back to 'validate' once the audit tables are confirmed in the DB.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# show SQL in logs (useful for learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# timezone fix for JVM -> DB communication
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# optional logging for SQL parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#jwt settings  (override in production via JWT_SECRET / JWT_EXPIRATION env vars)
jwt.secret=${JWT_SECRET:veryLongRandomSecretKeyThatIsAtLeast32Characters!}
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
